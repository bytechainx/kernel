# GitLab CI — kernel（特性 034：中央模板接入）
# fmt/clippy/test/doc 由 xhyperium/workspace 模板 governance-v1.0.3 提供；
# 其余 job 保留本仓自有定义。模板版本 pin tag，升级走 MR 改 ref。
include:
  - project: "xhyperium/workspace"
    ref: "governance-v1.0.3"
    file:
      - "/.gitlab/ci/templates/governance.yml"
      - "/.gitlab/ci/templates/rust.yml"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"'

variables:
  CARGO_TERM_COLOR: always
  MSRV: "1.88"

.rust:
  image: rust:1.88
  tags: [docker]
  cache:
    key: "$CI_COMMIT_REF_SLUG"
    paths:
      - .cargo/

msrv:
  extends: .rust
  stage: test
  script:
    - if [ "$MSRV" != "1.88" ]; then rustup toolchain install "$MSRV" --profile minimal; fi
    - cargo +"$MSRV" check --all-features

production-readiness:msrv:
  extends: .rust
  stage: test
  script:
    - cargo test
    - cargo build --manifest-path fixtures/consumer/Cargo.toml

production-readiness:api:
  extends: .rust
  stage: test
  script:
    - curl -fsSLO https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
    - tar -xJf node-v22.23.5-linux-x64.tar.xz -C /usr/local --strip-components=1
    - rm -f node-v22.23.5-linux-x64.tar.xz
    - node scripts/check-api-baseline.mjs
    - cargo test --test public_api_surface
    - cargo run --manifest-path fixtures/consumer/Cargo.toml

production-readiness:supply:
  extends: .rust
  stage: test
  variables:
    GIT_DEPTH: "0"
  script:
    - curl -fsSLO https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.xz
    - tar -xJf node-v22.23.5-linux-x64.tar.xz -C /usr/local --strip-components=1
    - rm -f node-v22.23.5-linux-x64.tar.xz
    - cargo tree --depth 1
    - node scripts/check-licenses.mjs
    - node scripts/check-evidence.mjs
    - node scripts/bench-baseline.mjs 3
