name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 rustfmt 与 clippy）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  loom:
    name: loom concurrency verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 运行 Loom 并发模型
        run: |
          set -euo pipefail
          RUSTFLAGS="--cfg loom" cargo test --test lifecycle_concurrency_loom --release 2>&1 | tee loom.log
          grep -Eq 'test result: ok\. [1-9][0-9]* passed; 0 failed' loom.log

  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链（含 llvm-tools）
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: 安装 cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: cargo llvm-cov report
        run: cargo llvm-cov --all-targets

  miri:
    name: miri undefined behavior checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 nightly 工具链（含 miri）
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - uses: Swatinem/rust-cache@v2

      - name: cargo miri setup
        run: cargo miri setup

      - name: cargo miri test
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation"
        run: cargo +nightly miri test

  mutants:
    name: mutation testing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装 cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      - uses: Swatinem/rust-cache@v2

      # 排除两个「套件永久阻塞」型变异体：lifecycle.rs:160 delete ! in wait
      # 与 lifecycle.rs:224 replace trigger with ()。它们被应用后测试挂起，
      # cargo-mutants 计为 timeout/失败；正常 cargo test / loom / CI 超时仍
      # 会发现同类回归。仓库 hook 禁止入库 .cargo/ 目录，故排除项走 CLI。
      - name: cargo mutants
        run: >-
          cargo mutants --timeout 300
          --exclude-re 'src/lifecycle\.rs:160:'
          --exclude-re 'src/lifecycle\.rs:224:'
